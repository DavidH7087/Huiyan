name: Huiyan Windows Portable Build
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pytest httpx
      - name: Install Chinese and English offline OCR runtime
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $root = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $root 'tesseract.exe'))) {
            $root = Join-Path ${env:ProgramFiles(x86)} 'Tesseract-OCR'
          }
          if (-not (Test-Path (Join-Path $root 'tesseract.exe'))) { throw 'Tesseract Windows runtime missing' }
          $data = Join-Path $root 'tessdata'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          foreach ($lang in @('chi_sim','eng')) {
            $url = "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$lang.traineddata"
            Invoke-WebRequest -Uri $url -OutFile (Join-Path $data "$lang.traineddata")
            if ((Get-Item (Join-Path $data "$lang.traineddata")).Length -lt 100000) { throw "OCR language package missing: $lang" }
          }
          & (Join-Path $root 'tesseract.exe') --list-langs
      - name: Run API tests on Windows
        run: |
          pip install reportlab
          python -m pytest -q tests/test_api.py tests/test_profile_api.py tests/test_format_ingestion.py tests/test_backup.py tests/test_backup_api.py tests/test_restore_profiles.py tests/test_description_clue_edits.py tests/test_round_history.py tests/test_task_change_history.py tests/test_retention_diagnostics.py tests/test_real_desktop_qa_regressions.py tests/test_profile_context_quality.py tests/test_multi_evidence_industry.py tests/test_desktop_excel_export.py
      - name: Create portable EXE
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed --name Huiyan --add-data "frontend:frontend" --collect-submodules uvicorn --collect-all webview --collect-all pytesseract --collect-all pypdfium2 --collect-all PIL --collect-all cryptography desktop.py
      - name: Bundle offline OCR into Windows application
        shell: pwsh
        run: |
          $source = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $source 'tesseract.exe'))) {
            $source = Join-Path ${env:ProgramFiles(x86)} 'Tesseract-OCR'
          }
          $target = 'dist\\Huiyan\\ocr'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force
          foreach ($needed in @('tesseract.exe', 'tessdata\\chi_sim.traineddata', 'tessdata\\eng.traineddata')) {
            if (-not (Test-Path (Join-Path $target $needed))) { throw "Missing bundled OCR file: $needed" }
          }
      - name: Smoke test source desktop launcher
        shell: pwsh
        run: |
          $env:HUIYAN_DESKTOP_SMOKE = '1'
          $env:HUIYAN_DESKTOP_SMOKE_REQUIRE_OCR = '1'
          $env:HUIYAN_DESKTOP_SMOKE_SCAN_PDF = '1'
          $env:HUIYAN_DATA_DIR = Join-Path $env:RUNNER_TEMP 'huiyan-smoke-source'
          python desktop.py
          if ($LASTEXITCODE -ne 0) { throw "Desktop source failed with $LASTEXITCODE" }
      - name: Smoke test bundled EXE (no GUI)
        shell: pwsh
        run: |
          $env:HUIYAN_DESKTOP_SMOKE = '1'
          $env:HUIYAN_DESKTOP_SMOKE_REQUIRE_OCR = '1'
          $env:HUIYAN_DESKTOP_SMOKE_SCAN_PDF = '1'
          $env:HUIYAN_DATA_DIR = Join-Path $env:RUNNER_TEMP 'huiyan-smoke-exe'
          $env:HUIYAN_DESKTOP_SMOKE_LOG = Join-Path $env:RUNNER_TEMP 'huiyan-smoke-traceback.txt'
          $exe = (Resolve-Path '.\\dist\\Huiyan\\Huiyan.exe').Path
          $process = Start-Process -FilePath $exe -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:HUIYAN_DESKTOP_SMOKE_LOG) { Get-Content $env:HUIYAN_DESKTOP_SMOKE_LOG }
            throw "Desktop bundled startup failed with $($process.ExitCode)"
          }
      - name: Package portable folder
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\Huiyan\*' -DestinationPath 'Huiyan-windows-x64.zip' -Force
      - name: Build Windows installer with Inno Setup
        shell: pwsh
        run: |
          $compiler = (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue).Source
          if (-not $compiler) {
            $paths = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
            )
            $compiler = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            $compiler = (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue).Source
          }
          if (-not $compiler) { throw 'Inno Setup compiler not available' }
          & $compiler 'packaging\huiyan.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed with $LASTEXITCODE" }
      - name: Verify silent installation and installed EXE
        shell: pwsh
        run: |
          $setup = (Get-ChildItem -Path 'dist\installer' -Filter 'Huiyan-Setup-*.exe' | Select-Object -First 1).FullName
          if (-not $setup) { throw 'Installer not produced' }
          $target = Join-Path $env:RUNNER_TEMP 'Huiyan-Installer-Test'
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`""
          $installation = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Silent installer failed with $($installation.ExitCode)" }
          $installedExe = Join-Path $target 'Huiyan.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed EXE is missing' }
          $env:HUIYAN_DESKTOP_SMOKE = '1'
          $env:HUIYAN_DESKTOP_SMOKE_REQUIRE_OCR = '1'
          $env:HUIYAN_DESKTOP_SMOKE_SCAN_PDF = '1'
          $env:HUIYAN_DATA_DIR = Join-Path $env:RUNNER_TEMP 'huiyan-installed-smoke'
          $app = Start-Process -FilePath $installedExe -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Installed EXE smoke failed with $($app.ExitCode)" }
      - name: Verify silent uninstall preserves local HR data
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Huiyan-Installer-Test'
          $executable = Join-Path $target 'Huiyan.exe'
          $uninstaller = Get-ChildItem -Path $target -Filter 'unins*.exe' -ErrorAction Stop | Select-Object -First 1
          if (-not $uninstaller) { throw 'Installer did not provide an uninstaller' }
          $removed = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstall failed: $($removed.ExitCode)" }
          if (Test-Path $executable) { throw 'Uninstaller left the EXE installed' }
          $database = Join-Path $env:RUNNER_TEMP 'huiyan-installed-smoke/huiyan.sqlite3'
          if (-not (Test-Path $database)) { throw 'Uninstall unexpectedly removed HR local data' }
      - name: Generate installer checksums and build provenance
        shell: pwsh
        run: |
          $files = @('Huiyan-windows-x64.zip')
          $files += @(Get-ChildItem 'dist/installer' -Filter 'Huiyan-Setup-*.exe' | ForEach-Object { $_.FullName })
          if ($files.Count -lt 2) { throw 'Build provenance expects installer and portable ZIP' }
          $checksums = foreach ($file in $files) {
            $sum = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sum.Length -ne 64) { throw "Invalid SHA256 for $file" }
            "$sum  $(Split-Path $file -Leaf)"
          }
          $checksums | Set-Content -Path 'Huiyan-SHA256SUMS.txt' -Encoding utf8
          $meta = @{
            product = 'Huiyan'; channel = 'unsigned-internal-preview'
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID
            platform = 'windows-x64'; generated_utc = [DateTime]::UtcNow.ToString('o')
          }
          $meta | ConvertTo-Json -Depth 4 | Set-Content -Path 'Huiyan-build.json' -Encoding utf8
          python -m pip list --format=json | Out-File -FilePath 'Huiyan-dependencies.json' -Encoding utf8
          if (-not (Test-Path 'Huiyan-SHA256SUMS.txt')) { throw 'Checksum file missing' }
      - name: Upload build verification data
        uses: actions/upload-artifact@v4
        with:
          name: Huiyan-build-verification
          path: |
            Huiyan-SHA256SUMS.txt
            Huiyan-build.json
            Huiyan-dependencies.json
          retention-days: 30
      - name: Upload installer preview (unsigned test artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Huiyan-windows-installer-preview
          path: dist/installer/Huiyan-Setup-*.exe
          retention-days: 30
      - name: Upload portable build (test artifact, not a release)
        uses: actions/upload-artifact@v4
        with:
          name: Huiyan-windows-x64-test-build
          path: Huiyan-windows-x64.zip
          retention-days: 30
