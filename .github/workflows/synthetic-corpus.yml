name: Huiyan Synthetic Corpus
on:
  push:
    branches: [main]
    paths:
      - 'testdata/synthetic/**'
      - 'requirements-fixtures.txt'
      - 'backend/engine.py'
      - 'backend/parsing.py'
      - '.github/workflows/synthetic-corpus.yml'
  pull_request:
    paths:
      - 'testdata/synthetic/**'
      - 'backend/app.py'
      - 'backend/engine.py'
      - 'backend/semantic.py'
      - 'backend/industry_context.py'
      - 'backend/parsing.py'
      - 'backend/profile.py'
      - '.github/workflows/synthetic-corpus.yml'
  workflow_dispatch:
jobs:
  synthetic-corpus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gbsn00lp fonts-noto-cjk
      - name: Install synthetic fixture dependencies
        run: python -m pip install -r requirements-fixtures.txt pytest httpx2
      - name: Check deterministic corpus generation
        run: python -m pytest -q testdata/synthetic/test_synthetic_corpus.py
      - name: Build complete text, Word, PDF, scan, and ZIP corpus
        run: python testdata/synthetic/build_corpus.py --out /tmp/huiyan-synthetic-corpus
      - name: Compare keyword engine against scenario labels
        run: python testdata/synthetic/benchmark.py --root /tmp/huiyan-synthetic-corpus
      - name: Validate format content and scan authenticity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          from docx import Document
          root=Path('/tmp/huiyan-synthetic-corpus')
          assert len(list((root/'txt').glob('*.txt'))) == 120
          assert len(list((root/'docx').glob('*.docx'))) == 120
          assert len(list((root/'pdf-text').glob('*.pdf'))) == 120
          assert len(list((root/'pdf-scan').glob('*.pdf'))) == 12
          assert len(list((root/'zip').glob('*.zip'))) == 20
          assert len(list((root/'invalid').iterdir())) == 3
          assert all(any(p.text for p in Document(str(f)).paragraphs) for f in (root/'docx').glob('*.docx'))
          assert all(PdfReader(str(f)).pages[0].extract_text().strip() for f in (root/'pdf-text').glob('*.pdf'))
          assert all(not (PdfReader(str(f)).pages[0].extract_text() or '').strip() for f in (root/'pdf-scan').glob('*.pdf'))
          from backend.parsing import extract_pages
          for folder in ('docx', 'pdf-text'):
            for file in sorted((root/folder).iterdir()):
              pages=extract_pages(file.name, file.read_bytes())
              assert pages and any(p['text'].strip() for p in pages), file
          assert json.loads((root/'META.json').read_text())['all_data_fictional'] is True
          print('Synthetic corpus format checks: OK')
          PY
      - name: Import 240 DOCX/PDF files through real screening API
        env:
          HUIYAN_SYNTHETIC_CORPUS: /tmp/huiyan-synthetic-corpus
        run: python -m pytest -q testdata/synthetic/test_full_ingestion.py
      - name: Package full fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          shutil.make_archive('Huiyan-Synthetic-Resumes-120','zip','/tmp','huiyan-synthetic-corpus')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Huiyan-Synthetic-Resumes-120
          path: Huiyan-Synthetic-Resumes-120.zip
          retention-days: 30
